# Configuration file for NQ FVG Backtesting System
# Modify these parameters to customize your backtest

[data]
# Data period
start_year = 2018
end_year = 2025

# Trading session (hours in 24-hour format)
session_start_hour = 2
session_start_minute = 0
session_end_hour = 6
session_end_minute = 0

[strategy]
# Risk/Reward ratio (e.g., 1.0 for 1:1, 1.5 for 1:1.5)
risk_reward_ratio = 1.0

# Number of candles to look back for swing high/low calculation
swing_lookback = 5

[backtest]
# Initial capital for backtesting
initial_capital = 100000

[output]
# Output file names
trade_journal = trade_journal.csv
equity_curve = equity_curve.png
trade_distribution = trade_distribution.png
monthly_returns = monthly_returns.png
sample_trades = sample_trades.png

# Number of sample trades to display in chart
num_sample_trades = 10
